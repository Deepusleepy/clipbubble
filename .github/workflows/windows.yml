name: Windows

on:
  push:
    paths: ['Windows/**', '.github/workflows/windows.yml']
  pull_request:
    paths: ['Windows/**', '.github/workflows/windows.yml']
  release:
    types: [published]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: dotnet build Windows/Tests/ClipBubble.Tests.csproj -c Release -nologo
      - run: Windows/Tests/bin/Release/net48/ClipBubble.Tests.exe
      - run: Compress-Archive Windows/bin/Release/net48/ClipBubble.exe ClipBubble-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ClipBubble-Windows
          path: ClipBubble-Windows.zip
      # Publishing a release (from the Mac, as usual) attaches the Windows build to it.
      - if: github.event_name == 'release'
        run: gh release upload "${{ github.event.release.tag_name }}" ClipBubble-Windows.zip --clobber
        env:
          GH_TOKEN: ${{ github.token }}
